<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【厨房タブレット】テイクアウトオーダー管理 (KDS)</title>
  <link rel="stylesheet" href="/css/style.css?v=4">
  <script src="/socket.io/socket.io.js"></script>
  <style>
    /* 管理者PIN認証ロック用スタイル */
    .pin-dot {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #64748b;
      background: transparent;
      transition: all 0.15s ease;
    }
    .pin-dot.filled {
      background: #38bdf8;
      border-color: #38bdf8;
      box-shadow: 0 0 12px rgba(56, 189, 248, 0.7);
      transform: scale(1.1);
    }
    .pin-key-btn {
      background: #334155;
      color: #fff;
      border: 1px solid #475569;
      border-radius: 12px;
      font-size: 1.4rem;
      font-weight: 700;
      padding: 14px 0;
      cursor: pointer;
      transition: all 0.1s;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pin-key-btn:active {
      background: #475569;
      transform: scale(0.95);
    }
    .pin-action-key {
      background: #1e293b;
      color: #94a3b8;
      font-size: 1.1rem;
    }
    @keyframes pinShake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-8px); }
      40%, 80% { transform: translateX(8px); }
    }
    .pin-shake {
      animation: pinShake 0.35s ease;
    }
  </style>
</head>
<body class="kitchen-body">

  <!-- 管理者PIN認証ロック画面（未認証時は全画面をガード） -->
  <div id="kitchen-auth-overlay" style="position: fixed; inset: 0; background: #0f172a; z-index: 99999; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 20px;">
    <div id="pin-card-box" style="background: #1e293b; border: 1px solid #334155; border-radius: 20px; padding: 32px 24px; width: 100%; max-width: 360px; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7); text-align: center;">
      <div style="font-size: 2.6rem; margin-bottom: 8px;">🔒</div>
      <h2 style="color: #fff; font-size: 1.3rem; font-weight: 800; margin-bottom: 6px;">厨房モニター 管理者認証</h2>
      <p style="color: #94a3b8; font-size: 0.85rem; margin-bottom: 20px;">管理者・スタッフ用の暗証番号を入力してください</p>

      <!-- 暗証番号表示用ドット -->
      <div id="pin-display-dots" style="display: flex; justify-content: center; gap: 16px; margin-bottom: 16px;">
        <span class="pin-dot" id="pindot-0"></span>
        <span class="pin-dot" id="pindot-1"></span>
        <span class="pin-dot" id="pindot-2"></span>
        <span class="pin-dot" id="pindot-3"></span>
      </div>

      <!-- エラーメッセージ -->
      <div id="pin-error-msg" style="color: #ef4444; font-size: 0.88rem; font-weight: bold; min-height: 22px; margin-bottom: 12px;"></div>

      <!-- テンキーパッド -->
      <div style="display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 20px;">
        <button type="button" class="pin-key-btn" onclick="inputPin('1')">1</button>
        <button type="button" class="pin-key-btn" onclick="inputPin('2')">2</button>
        <button type="button" class="pin-key-btn" onclick="inputPin('3')">3</button>
        <button type="button" class="pin-key-btn" onclick="inputPin('4')">4</button>
        <button type="button" class="pin-key-btn" onclick="inputPin('5')">5</button>
        <button type="button" class="pin-key-btn" onclick="inputPin('6')">6</button>
        <button type="button" class="pin-key-btn" onclick="inputPin('7')">7</button>
        <button type="button" class="pin-key-btn" onclick="inputPin('8')">8</button>
        <button type="button" class="pin-key-btn" onclick="inputPin('9')">9</button>
        <button type="button" class="pin-key-btn pin-action-key" onclick="clearPin()">C</button>
        <button type="button" class="pin-key-btn" onclick="inputPin('0')">0</button>
        <button type="button" class="pin-key-btn pin-action-key" onclick="backspacePin()">⌫</button>
      </div>

      <label style="display: flex; align-items: center; justify-content: center; gap: 8px; color: #94a3b8; font-size: 0.85rem; cursor: pointer; user-select: none;">
        <input type="checkbox" id="chk-remember-auth" checked style="width: 16px; height: 16px; cursor: pointer;">
        この端末を記憶する（次回自動ログイン）
      </label>
      
      <div style="margin-top: 20px; border-top: 1px solid #334155; padding-top: 14px;">
        <a href="/" style="color: #64748b; font-size: 0.85rem; text-decoration: underline;">注文画面（お客様トップ）へ戻る</a>
      </div>
    </div>
  </div>

  <!-- 音声有効化案内バナー（ブラウザの自動再生ブロック解除用） -->
  <div id="audio-unlock-banner" style="display: none; background: #ea580c; color: #ffffff; padding: 12px 16px; font-weight: 800; font-size: 1rem; text-align: center; cursor: pointer; border-bottom: 2px solid #c2410c; box-shadow: 0 4px 12px rgba(234, 88, 12, 0.4);">
    🔔 【重要】ブラウザの制限で音声が停止しています。ここをタップして注文受付音（チャイム）を有効化してください
  </div>

  <!-- 厨房ヘッダー -->
  <!-- 厨房ヘッダー（スリム1段構成） -->
  <header class="kitchen-header">
    <div style="display: flex; align-items: center; gap: 8px; flex-wrap: wrap;">
      <h1 class="kitchen-title">
        厨房モニター
      </h1>
      <span id="badge-business-hours" class="summary-badge-mini">営業中</span>
      <button id="btn-toggle-accepting" class="btn-store-status-mini accepting" title="タップで注文受付を休止/再開">
        注文受付中
      </button>
      <button id="btn-toggle-temp-closed" class="btn-store-status-mini temp-closed-off" title="タップで臨時休業を切替">
        臨時休業: OFF
      </button>
    </div>

    <div style="display: flex; gap: 6px; align-items: center; flex-wrap: wrap;">
      <!-- 品切れ・売り切れ管理 開閉トグルボタン -->
      <button type="button" id="btn-toggle-soldout-bar" class="header-action-btn soldout-toggle-btn" title="タップで品切れ・売り切れ設定パネルを開閉">
        <span>品切れ管理</span>
        <span id="header-soldout-pill" class="soldout-mini-pill ok">全品販売中</span>
        <span id="soldout-arrow-icon" style="font-size: 0.7rem; transition: transform 0.2s;">▼</span>
      </button>

      <!-- 注文番号検索ボックス -->
      <input type="text" id="input-search-order" placeholder="番号検索" class="header-search-input" title="注文番号（英数3桁）で検索">

      <!-- 音声アラート切替 & 音テスト -->
      <button id="btn-sound-toggle" class="header-action-btn" title="音声アラートのON/OFF">
        音声: ON
      </button>
      <button id="btn-sound-test" class="header-action-btn btn-test-sound" title="タップして音が鳴るか確認">
        🔊
      </button>

      <!-- 画面ロックボタン -->
      <button id="btn-lock-kitchen" class="header-action-btn" title="画面をロックして保護">
        🔒
      </button>

      <!-- 注文画面リンク -->
      <a href="/" target="_blank" class="header-link-btn" title="お客様注文画面を別タブで開く">
        注文画面 ↗
      </a>

      <!-- 互換性保持用の非表示バッジ（JSエラー防止） -->
      <span id="badge-received" style="display: none;"></span>
      <span id="badge-cooking" style="display: none;"></span>
      <span id="badge-ready" style="display: none;"></span>
    </div>
  </header>

  <!-- メニュー売り切れ即時切替バー（デフォルトは折りたたみ非表示、トグルボタンで開閉） -->
  <section class="soldout-manager-bar" id="soldout-manager-bar" style="display: none;">
    <div class="soldout-manager-header">
      <div style="display: flex; align-items: center; gap: 8px;">
        <span class="soldout-header-title">品切れ・売り切れ設定</span>
        <span style="font-size: 0.75rem; color: #94a3b8;">（タップで即座にお客様画面に売り切れが反映されます）</span>
      </div>
      <div id="soldout-status-summary" style="font-size: 0.8rem; color: #cbd5e1;"></div>
    </div>
    <div class="soldout-chips-container" id="soldout-chips-container">
      <!-- JSで動的描画 -->
    </div>
  </section>

  <!-- フィルタータブバー（件数バッジ一体型・省スペース構成） -->
  <div class="kitchen-filter-bar">
    <div style="display: flex; gap: 6px; flex-wrap: wrap; align-items: center;">
      <button class="kds-tab-btn active" id="tab-all" onclick="setFilter('all')">
        全進行中 <span class="tab-badge" id="tab-count-all">0</span>
      </button>
      <button class="kds-tab-btn" id="tab-received" onclick="setFilter('RECEIVED')">
        未対応 <span class="tab-badge bg-red" id="tab-count-received">0</span>
      </button>
      <button class="kds-tab-btn" id="tab-cooking" onclick="setFilter('COOKING')">
        調理中 <span class="tab-badge bg-blue" id="tab-count-cooking">0</span>
      </button>
      <button class="kds-tab-btn" id="tab-ready" onclick="setFilter('READY')">
        受取待ち <span class="tab-badge bg-green" id="tab-count-ready">0</span>
      </button>
      <button class="kds-tab-btn" id="tab-completed" onclick="setFilter('completed')">
        完了履歴
      </button>
    </div>
    <div style="display: flex; align-items: center; gap: 10px;">
      <span id="badge-capacity" class="capacity-mini-badge">進行枠: 0 / 10件</span>
      <span style="color: #64748b; font-size: 0.75rem;">※古い注文順</span>
    </div>
  </div>

  <!-- 注文一覧グリッド -->
  <main class="kitchen-grid" id="kitchen-orders-grid">
    <!-- 動的生成される注文カード -->
  </main>

  <script src="/js/kitchen.js?v=48"></script>
</body>
</html>
